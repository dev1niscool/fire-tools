name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and subprocess tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q open_fire_toolkit tests scripts
      - name: Exercise offline command-line demo
        run: python -m open_fire_toolkit --demo tool debloat --serial DEMO_FIRE_HD10 --param profile=standard
      - name: Build source-only archive
        run: python scripts/package_release.py
