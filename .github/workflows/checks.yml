name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
        include:
          - os: macos-15
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Select a canonical temporary directory
        if: runner.os == 'macOS'
        run: python -c 'import os; from pathlib import Path; print("TMPDIR=" + str(Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)))' >> "$GITHUB_ENV"
      - name: Run tablet workflow and subprocess tests on supported hosts
        if: runner.os != 'macOS'
        run: python -m unittest discover -s tests -v
      - name: Exercise supported macOS offline workflows
        timeout-minutes: 3
        if: runner.os == 'macOS'
        run: |
          python -m unittest discover -s tests -p test_cli.py -v
          python -m unittest discover -s tests -p test_apk_checks.py -v
          sh launch.sh --demo info --serial DEMO_FIRE_HD10
          sh launch.sh tool debloat-presets
          python tests/gui_smoke.py
          python -m unittest discover -s tests -p test_device_workflows.py -k directory_descriptor_requires_working_child_lookup
      - name: Exercise the desktop on a virtual display
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python tests/gui_smoke.py
          xvfb-run -a python tests/gui_expanded_smoke.py
      - name: Compile Python sources
        run: python -m compileall -q open_fire_toolkit tests scripts
      - name: Exercise offline command-line demo
        run: python -m open_fire_toolkit --demo tool debloat --serial DEMO_FIRE_HD10 --param profile=standard
      - name: Build source-only archive
        run: python scripts/package_release.py
