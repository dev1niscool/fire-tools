name: Publish handbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
      - 'docs/**'
      - 'open_fire_toolkit/**'
      - 'companion/**'
      - 'scripts/**'
      - 'launch-*'
      - 'launch.sh'
      - 'pyproject.toml'
      - 'release-files.txt'
      - 'README.md'
      - 'SECURITY.md'
      - 'LICENSE'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild and verify the pinned browser USB adapter
        working-directory: website/browser-transport
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          git diff --exit-code -- ../assets/adb-transport.js
      - name: Test experimental browser tools
        run: node --test website/tests/browser-*.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Exercise the browser UI with a simulated USB tablet
        timeout-minutes: 5
        run: |
          python -m venv "$RUNNER_TEMP/fire-tools-browser-test"
          "$RUNNER_TEMP/fire-tools-browser-test/bin/pip" install --only-binary=:all: --require-hashes -r website/tests/webusb/requirements-ci.txt
          CHROMIUM_PATH="$(command -v google-chrome)" "$RUNNER_TEMP/fire-tools-browser-test/bin/python" website/tests/webusb/smoke.py
      - name: Build handbook
        run: python3 website/build.py --output _site
      - name: Check handbook integrity
        run: python3 -m unittest discover -s website/tests -v
      - name: Check guided tutorial routes
        run: node --test website/tests/tutorial-route.test.js
      - name: Upload handbook
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy handbook
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
