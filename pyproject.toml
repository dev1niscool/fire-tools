[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fire-toolkit"
version = "0.1.0"
description = "Inspectable desktop and command-line utilities for Amazon Fire tablets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
open-fire-toolkit = "open_fire_toolkit.cli:main"

[tool.setuptools]
packages = ["open_fire_toolkit"]
